---
- name: Install MVG Scraper
  hosts: data.mvg.auch.cool
  remote_user: root
  vars_files:
    - vault.yaml

  tasks:
  - name: install services
    copy:
      src: "{{ item }}"
      dest: /etc/systemd/system/
    loop:
      - "../scraper/mvg-scraper.service"
      - "../scraper/sbahn-scraper.service"

  - name: start services
    systemd:
      state: started
      enabled: true
      name: "{{ item }}"
      daemon_reload: true
    loop:
      - mvg-scraper.service
      - sbahn-scraper.service